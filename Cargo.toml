[package]
name = "min"
version = "0.1.0-alpha.2"
edition = "2024"
license="MIT"
description="A bridge between max and telegram created over min-rs crate."
authors = ["BadCoder"]
readme="README.md"
repository="https://github.com/Vova-max-png/min"
keywords = ["max", "messenger"]
include = ["config.json"]

[dependencies]
futures-util = "0.3.31"
tokio = { version = "1", features = ["full", "rt", "rt-multi-thread", "sync"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
dotenvy = "0.15.7"
teloxide = "0.17.0"
min-rs = "0.1.5-alpha.1"
min-rs-config = "0.1.3"
self_update = { version = "0.42.0", features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "signatures"] }
reqwest = "0.13.1"
tempfile = "3.24.0"
self-replace = "1.5.0"

[dependencies.uuid]
version = "1.19.0"
features = [
    "v4",
]
